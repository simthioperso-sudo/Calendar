$('#dl').innerHTML=`<h3>${o?'Modifier':'Ajouter'}</h3><label>Titre<input id=f1 value="${q(it.t)}"></label><label>Catégorie / objectif<select id=f2>${S.cats.map(c=>`<option value="${c.id}" ${c.id==it.cat?'selected':''}>${c.n}</option>`).join('')}</select></label>
<label>Statut<select id=f3>${['fixe','important','facultatif'].map(p=>`<option ${p==it.p?'selected':''}>${p}</option>`).join('')}</select></label><label>Date<input type=date id=f4 value="${dt}"></label>
<div class=r><label>Début<input type=time id=f5 value="${it.s}"></label><label>Fin<input type=time id=f6 value="${it.e}"></label></div>
<label><input type=checkbox id=f9 ${ec?'checked':''} onchange="if(this.checked)$('#f7').checked=false"> Échéance (ponctuelle)</label>
<label><input type=checkbox id=f7 ${rc?'checked':''} onchange="if(this.checked)$('#f9').checked=false"> Récurrent (chaque semaine)</label><div class=dw>${[1,2,3,4,5,6,0].map(i=>`<label><input type=checkbox class=wd value=${i} ${dw.includes(i)?'checked':''}>${NJ[i]}</label>`).join('')}</div>
${rc?`<hr><label><input type=radio name=sc value=one checked> Cette occurrence uniquement</label><label><input type=radio name=sc value=all> Toutes les occurrences futures</label>`:''}
<div class=r style="flex-wrap:wrap"><button class=p onclick="fm()">Enregistrer</button>${cb?`<button onclick="tb()">${occ(o.date).some(x=>x.it.cat==='tamp')?'Mettre sur l’heure tampon':'Reporter à demain'}</button>`:''}${o?'<button onclick="fd()">Supprimer</button>':''}<button onclick="$('#dl').close()">Annuler</button></div>`;$('#dl').showModal()}
function tb(){toBuf(V.o.key);$('#dl').close();save()}
function fm(){const o=V.o,t=$('#f1').value.trim(),s=$('#f5').value,e=$('#f6').value,date=$('#f4').value;if(!t||!s||!e||!date||s>=e)return alert('Titre, date et horaires valides requis');
const ec=$('#f9').checked?1:0,v={t,cat:$('#f2').value,p:$('#f3').value,date,s,e,ech:ec},sc=(document.querySelector('[name=sc]:checked')||{}).value||'one';
if($('#f7').checked&&!ec){const d=[...document.querySelectorAll('.wd:checked')].map(x=>+x.value);if(!d.length)return alert('Choisis au moins un jour');v.rec={d,from:date,to:(o&&o.it.rec&&o.it.rec.to)||''}}
const a=tm(s),b=tm(e),ov=occ(date).filter(x=>(!o||x.key!==o.key)&&x.s<b&&x.e>a&&x.it.p!=='fixe'&&trk(x));V.pd={o,v,sc,ov:ov.map(x=>x.key)};
if(!ov.length)return fin(0);
$('#dl').innerHTML=`<h3>Créneau déjà occupé</h3><p>${ov.map(x=>'« '+x.it.t+' »').join(', ')} chevauche ce nouveau créneau</p><div class=r style="flex-wrap:wrap"><button class=p onclick="fin(1)">Les retirer</button><button onclick="fin(2)">Les mettre en heure tampon</button><button onclick="fin(0)">Garder les deux</button></div>`}
function fin(a){const P=V.pd,v=P.v,xs=P.ov.map(getO);
if(!P.o){const x={id:ID(),t:v.t,cat:v.cat,p:v.p,s:v.s,e:v.e,ech:v.ech};if(v.rec){x.rec=v.rec;x.ex={}}else x.date=v.date;S.items.push(x)}else apply(P.o,v,P.sc);
xs.forEach(x=>{if(x){if(a==1)del(x,'one');else if(a==2)toBuf(x.key)}});$('#dl').close();save()}
function fd(){if(!confirm('Supprimer ?'))return;del(V.o,(document.querySelector('[name=sc]:checked')||{}).value||'one');$('#dl').close();save()}
function cc(i,f,v){S.cats[i][f]=v;save()}
function cn(){S.cats.push({id:ID(),n:'Nouvel objectif',c:'#c8d6ea',t:0});save();set()}
function set(){$('#dl').innerHTML=`<h3>Objectifs suivis</h3><small>Couleur · nom · cible (h/semaine)</small>`+S.cats.map((c,i)=>`<div class=r><input type=color style="width:46px;padding:1px" value="${c.c}" onchange="cc(${i},'c',this.value)"><input value="${q(c.n)}" onchange="cc(${i},'n',this.value)"><input type=number step=.5 style="width:70px" value="${c.t||0}" onchange="cc(${i},'t',+this.value)"></div>`).join('')+`<button onclick="cn()">＋ Nouvel objectif suivi</button><hr><p><small>${V.user?'Connecté : '+V.user:'Mode local'}</small></p><div class=r><button onclick="ex()">Exporter JSON</button><button onclick="rs()">Config. Firebase</button></div><label>Importer JSON<input type=file accept=.json onchange="im(this.files[0])"></label><button onclick="$('#dl').close()">Fermer</button>`;$('#dl').showModal()}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='planning.json';a.click()}
function im(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();$('#dl').close()}catch(e){alert('Fichier invalide')}};r.readAsText(f)}
function rs(){localStorage.removeItem('fbcfg');localStorage.removeItem('local');location.reload()}
function go(n){if(V.tab=='j')V.d=addD(V.d,n);else if(V.tab=='s')V.wk=addD(V.wk,7*n);else if(V.tab=='m'){const a=V.mo.split('-'),d=new Date(+a[0],a[1]-1+n,1);V.mo=d.getFullYear()+'-'+pad(d.getMonth()+1)}else V.y+=n;render()}
const nv=t=>`<div class=nv><button onclick="go(-1)">◀</button><b>${t}</b><button onclick="go(1)">▶</button><button onclick="V.d=today();V.wk=mon(V.d);V.mo=V.d.slice(0,7);V.y=+V.d.slice(0,4);render()">Aujourd’hui</button></div>`;
function chip(o){const c=C(o.it.cat);return`<div class="chip ${S.done[o.key]?'done':''}" draggable="true" data-k="${o.key}" ondragstart="event.dataTransfer.setData('text',this.dataset.k)" style="background:${c.c}" onclick="event.stopPropagation();ed('${o.key}')">${ft(o.s)} ${o.it.t}</div>`}
/* ---- vues ---- */
function vJ(){const d=V.d,t=today(),isT=d===t,now=nowM(),os=occ(d),al=os.filter(o=>!C(o.it.cat).x),ts=os.filter(trk),dn=ts.filter(o=>S.done[o.key]).length,pc=ts.length?Math.round(100*dn/ts.length):0,st=streak();
const cur=isT&&al.find(o=>o.s<=now&&now<o.e),nx=isT&&al.find(o=>o.s>now),L=o=>o?`${o.it.t} (${ft(o.s)}–${ft(o.e)})`:'—';
return nv(pd(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+`<div class=card><div style="display:flex;justify-content:space-between"><b>${dn}/${ts.length} terminées</b><b>${pc} %</b></div><div class=bar><i style="width:${pc}%"></i></div>${isT?`<p style="margin:8px 0 0"><b>En cours :</b> ${L(cur)}<br><b>Suivante :</b> ${L(nx)}</p>`:''}<p style="margin:6px 0 0"><small>Série : ${st} jour${st>1?'s':''} d’affilée</small></p></div><div class=card>`
+(os.length?os.map(o=>{const c=C(o.it.cat),k=o.key,dn=S.done[k],tr=trk(o),run=S.tm&&S.tm.key===k,pl=o.e-o.s,pst=!tr&&(d<t||(isT&&o.e<=now));
return`<div class="ev ${dn?'done':''} ${pst?'past':''}" style="border-color:${c.c};background:${c.c}33"><small>${ft(o.s)}<br>${ft(o.e)}</small>${tr?`<input type=checkbox ${dn?'checked':''} onchange="tg('${k}')">`:''}<div style="flex:1;min-width:0" onclick="ed('${k}')"><b>${o.it.t}</b><br><small>${c.n}${dn?' · réalisé '+fh(dn):''}</small></div>${dn?`<button onclick="cm('${k}')">✎</button>`:(tr&&isT?(run?`<b class=tk></b><button onclick="V.focus=1;render()">Focus</button><button class=p onclick="tmE()">Je termine</button>`:`<small>${fh(pl)}</small><button onclick="tmS('${k}')">Je commence</button>`):'')}<span class="tg ${o.it.p}">${o.it.p}</span></div>`}).join(''):'<p>Rien de prévu ce jour, utilise ＋ pour ajouter</p>')+`</div>`}
function bil(m){const r={},T={p:0,r:0,d:0,u:0,rp:0},t=today();for(let i=0;i<7;i++){const d=addD(m,i);occ(d).forEach(o=>{if(!trk(o))return;const x=r[o.it.cat]=r[o.it.cat]||{p:0,r:0,m:0},p=o.e-o.s,dn=S.done[o.key];x.p+=p;T.p+=p;if(dn){x.r+=dn;T.r+=dn;T.d++}else if(d<t){x.m++;T.u++}})}
for(const k in S.rep){const d=k.split('@')[1];if(d>=m&&d<=addD(m,6))T.rp++}return{r,T}}
function arch(){const b=mon(today());for(let i=1;i<=8;i++){const m=addD(b,-7*i);if(!S.hist[m]){const x=bil(m);if(x.T.p)S.hist[m]={p:x.T.p,r:x.T.r}}}}
function vB(m){const{r,T}=bil(m),t=today(),rate=T.p?Math.round(100*T.r/T.p):0,rows=S.cats.filter(c=>!c.x&&(r[c.id]||c.t)),se=[];
const tb=rows.map(c=>{const x=r[c.id]||{p:0,r:0,m:0},pc=x.p?Math.round(100*x.r/x.p):0;if(x.p&&c.id!='cours')se.push(pc>=100?`Tu as atteint 100 % de ton objectif « ${c.n} »`:`${c.n} : ${pc} % de l’objectif`);
return`<tr><td><i class=dot style="background:${c.c}"></i>${c.n}</td><td>${fh(x.p)}</td><td>${c.t?c.t+'h':'–'}</td><td>${fh(x.r)}</td><td><div class=bar><i style="width:${Math.min(100,pc)}%"></i></div>${pc} %</td><td>${x.m}</td></tr>`}).join('');
let un='';for(let i=0;i<7;i++){const d=addD(m,i);if(d<t)occ(d).forEach(o=>{if(trk(o)&&!S.done[o.key])un+=`<div class=gr><span>${d.slice(5)} · ${o.it.t}</span><span><button onclick="ro('${o.key}',1)">Sem. suivante</button> <button onclick="ro('${o.key}',2)">Reprogrammer</button> <button onclick="ro('${o.key}',3)">✕</button></span></div>`})}
return`<h3>Bilan de la semaine</h3><div class=card><b>Prévu ${fh(T.p)} · Réalisé ${fh(T.r)} · ${rate} %</b><br><small>${T.d} terminées · ${T.u} non terminées · ${T.rp} reportées</small><div class=bar style="margin-top:6px"><i style="width:${Math.min(100,rate)}%"></i></div></div>
<div class=card style="overflow-x:auto"><table><tr><th>Activité</th><th>Prévu</th><th>Cible</th><th>Réalisé</th><th>Progression</th><th>Non faites</th></tr>${tb}</table></div>
<div class=card><b>Bilan</b><br>${se.length?se.join('<br>'):'Pas encore de données cette semaine'}</div>${un?`<div class=card><b>Tâches non réalisées</b>${un}</div>`:''}
<div class=card><b>Historique</b>${Object.keys(S.hist).sort().reverse().slice(0,10).map(k=>`<div onclick="V.wk='${k}';render()" style="cursor:pointer">Semaine du ${k} : ${Math.round(100*S.hist[k].r/S.hist[k].p)} % (${fh(S.hist[k].r)}/${fh(S.hist[k].p)})</div>`).join('')||'<br><small>Les bilans passés s’enregistrent automatiquement</small>'}</div>`}
function vS(){const m=V.wk,ds7=[...Array(7)].map((_,i)=>addD(m,i)),t=today();
return nv('Semaine du '+pd(m).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))+`<div class=wk>`+ds7.map(d=>`<div class="day ${d===t?'tod':''}" ondragover="event.preventDefault()" ondrop="dp(event,'${d}')"><b style="cursor:pointer" onclick="V.d='${d}';V.tab='j';render()">${NJ[pd(d).getDay()]} ${+d.slice(8)}</b>${occ(d).filter(o=>!C(o.it.cat).x).map(chip).join('')}</div>`).join('')+`</div>`+vB(m)}
function gl(sc){const a=sc=='m'?(S.mo[V.mo]=S.mo[V.mo]||[]):S.lt;return`<div class=card><b>${sc=='m'?'Objectifs du mois':'Objectifs long terme'}</b>${a.map((g,i)=>`<div class=gr><span>${g.t}</span><span><button onclick="gp('${sc}',${i},-1)">−</button> ${g.n}/${g.g} <button onclick="gp('${sc}',${i},1)">+</button> <button onclick="gp('${sc}',${i},0)">✕</button></span></div><div class=bar><i style="width:${Math.min(100,100*g.n/g.g)}%"></i></div>`).join('')}<p><button onclick="ga('${sc}')">＋ Ajouter</button></p></div>`}
function gp(sc,i,d){const a=sc=='m'?S.mo[V.mo]:S.lt;if(!d)a.splice(i,1);else a[i].n=Math.max(0,a[i].n+d);save()}
function ga(sc){const t=prompt('Objectif :');if(!t)return;const g=+prompt('Valeur cible (nombre) :','1')||1;(sc=='m'?(S.mo[V.mo]=S.mo[V.mo]||[]):S.lt).push({t,n:0,g});save()}
function vM(){const a=V.mo.split('-').map(Number),y=a[0],mm=a[1],lead=(new Date(y,mm-1,1).getDay()+6)%7,n=new Date(y,mm,0).getDate(),t=today(),P={};let g='';for(let i=0;i<lead;i++)g+='<div></div>';
for(let i=1;i<=n;i++){const d=V.mo+'-'+pad(i),os=occ(d).filter(o=>!C(o.it.cat).x);os.forEach(o=>{if(!trk(o))return;const x=P[o.it.cat]=P[o.it.cat]||{p:0,r:0};x.p+=o.e-o.s;x.r+=S.done[o.key]||0});const sh=os.filter(o=>o.it.p!=='facultatif');
g+=`<div class="day ${d===t?'tod':''} ${os.some(o=>o.it.ech)?'hot':''}" onclick="V.d='${d}';V.tab='j';render()" ondragover="event.preventDefault()" ondrop="dp(event,'${d}')"><b>${i}</b>${sh.slice(0,3).map(chip).join('')}${sh.length>3?'<small>+'+(sh.length-3)+'</small>':''}</div>`}
return nv(new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))+`<div class=mg>${['L','M','M','J','V','S','D'].map(x=>`<small>${x}</small>`).join('')}${g}</div>${ecl(V.mo)}<h3>Progression du mois</h3><div class=card>`+Object.keys(P).map(id=>{const c=C(id),x=P[id],pc=x.p?Math.round(100*x.r/x.p):0;return`<div class=gr><span><i class=dot style="background:${c.c}"></i>${c.n}</span><span>${fh(x.r)} / ${fh(x.p)}</span></div><div class=bar><i style="width:${pc}%"></i></div>`}).join('')+`</div>`+gl('m')}
function resp(d){const a=occ(d).filter(trk);return a.length>0&&a.every(o=>S.done[o.key])}
function streak(){let n=0,d=today();if(!resp(d))d=addD(d,-1);for(let i=0;i<400&&resp(d);i++){n++;d=addD(d,-1)}return n}
function ecl(p,pl){const l=S.items.filter(i=>i.ech&&i.date&&i.date.startsWith(p)).sort((a,b)=>a.date.localeCompare(b.date)||a.s.localeCompare(b.s));if(!l.length&&!pl)return'';
return`<div class=card><div class=gr style="margin:0"><b>Échéances</b>${pl?'<button onclick="addEv(null,null,1)">＋</button>':''}</div>${l.map(i=>`<div class=gr onclick="ed('${i.id}@${i.date}')" style="cursor:pointer"><span><i class=dot style="background:${C(i.cat).c}"></i>${i.date.slice(8)}/${i.date.slice(5,7)} · ${i.t}<br><small>${C(i.cat).n} · ${i.s}–${i.e}</small></span><span class="tg ${i.p}">${i.p}</span></div>`).join('')||'<small>Aucune échéance</small>'}</div>`}
function vA(){const y=V.y,t=today(),E=new Set(S.items.filter(i=>i.ech&&i.date).map(i=>i.date));let h='',rd=0;
for(let i=(new Date(y,0,1).getDay()+6)%7;i>0;i--)h+='<i style="visibility:hidden"></i>';
for(const d=new Date(y,0,1);d.getFullYear()==y;d.setDate(d.getDate()+1)){const s=ds(d),r=s<=t&&resp(s);if(r)rd++;h+=`<i class="${s<t?'hp':''} ${E.has(s)?'he':''} ${r?'hr':''} ${s===t?'ht':''}" title="${s}${E.has(s)?' · échéance':''}${r?' · respecté':''}" onclick="V.d='${s}';V.tab='j';render()"></i>`}
const cat={},tot={};S.items.forEach(i=>cat[i.id]=i.cat);for(const k in S.done){const a=k.split('@');if(a[1].startsWith(y)&&cat[a[0]])tot[cat[a[0]]]=(tot[cat[a[0]]]||0)+S.done[k]}
const mx=Math.max(1,...Object.values(tot));
return nv(y)+`<div class=card><b>Régularité</b><br><small>Série en cours : ${streak()} jour(s) d’affilée · ${rd} jour(s) respecté(s) cette année</small><div class=heat>${h}</div><small>Marine : jour passé · rond : tout fait · rouge : échéance</small></div>`+ecl(String(y),1)+`<div class=card><b>Heures réalisées par catégorie</b>`+Object.keys(tot).map(id=>`<div class=gr><span><i class=dot style="background:${C(id).c}"></i>${C(id).n}</span><span>${fh(tot[id])}</span></div><div class=bar><i style="width:${100*tot[id]/mx}%"></i></div>`).join('')+`</div>`+gl('l')}
function prog(){const al=occ(V.d).filter(o=>!C(o.it.cat).x),n=al.length;if(!n)return'';const now=nowM(),isT=V.d===today(),pst=V.d<today();let i=isT?al.findIndex(o=>o.e>now):-1;if(isT&&i<0)i=n-1;const L=j=>n>1?100*j/(n-1):50;
return`<footer><div class=track>${isT?`<span class=cur style="left:${L(i)}%">▼</span>`:''}${al.map((o,j)=>{const ok=trk(o)?S.done[o.key]:(pst||(isT&&o.e<=now));return`<span class="pt ${ok?'ok':''}" style="left:${L(j)}%;background:${C(o.it.cat).c}" title="${o.it.t}"></span><span class=hl style="left:${L(j)}%">${ft(o.s)}</span>`}).join('')}</div></footer>`}
function render(){const c=localStorage.fbcfg;
if(!c&&!localStorage.local){$('#app').innerHTML=`<div class=card style="max-width:560px;margin:30px auto"><h2>Configuration</h2><p>Colle ici la configuration Firebase (voir le guide) ou continue sans synchronisation</p><textarea id=cf rows=9></textarea><p><button class=p onclick="cs()">Enregistrer</button> <button onclick="localStorage.local=1;render()">Sans synchronisation</button></p></div>`;return}
if(V.login){$('#app').innerHTML=`<div class=card style="max-width:420px;margin:60px auto;text-align:center"><h2>Mon Planning</h2><button class=p onclick="login()">Se connecter avec Google</button><p><small>${V.err||''}</small></p></div>`;return}
const tabs=[['j','Jours'],['s','Semaine'],['m','Mois'],['a','Année']];
$('#app').innerHTML=`<header><b>${ic()}Planning</b><nav>${tabs.map(t=>`<button class="${V.tab==t[0]?'on':''}" onclick="V.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><span><button onclick="addEv()">＋</button> <button onclick="set()">⚙</button></span></header><main>${{j:vJ,s:vS,m:vM,a:vA}[V.tab]()}</main>`+(V.tab=='j'?prog():'');
$('#nt').innerHTML=nt();$('#fo').innerHTML=fo();tick()}
try{S=JSON.parse(localStorage[KEY])}catch(e){}if(!S||!S.items)S=seed();if((S.v||1)<2)mig();
V={tab:'j',d:today(),wk:mon(today()),mo:today().slice(0,7),y:new Date().getFullYear(),focus:!!S.tm};arch();if(S.tm)lock();
if(localStorage.fbcfg){try{fb(JSON.parse(localStorage.fbcfg))}catch(e){}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
setInterval(()=>{if(!$('dialog[open]'))render()},30000);setInterval(tick,1000);
</script></body></html>
