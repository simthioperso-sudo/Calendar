+prop.map(o=>`<div class=card>« <b>${o.it.t}</b> » n’est pas cochée. La déplacer dans l’heure tampon ?<div class=r><button class=p onclick="bf('${o.key}')">J’accepte</button><button onclick="sk('${o.key}')">Je ne le fais pas</button></div></div>`).join('')
+`<div class=card>`+(os.length?os.map(o=>{const c=C(o.it.cat),k=o.key,dn=S.done[k],run=S.tm&&S.tm.key===k;
return`<div class="ev ${dn?'done':''}" style="border-color:${c.c};background:${c.c}33"><small>${ft(o.s)}<br>${ft(o.e)}</small>${c.x?'':`<input type=checkbox ${dn?'checked':''} onchange="tg('${k}')">`}<div style="flex:1" onclick="ed('${k}')"><b>${o.it.t}</b><br><small>${c.n} · <span class="tg ${o.it.p}">${o.it.p}</span>${dn?' · réalisé '+fh(dn):''}${run?' · en cours depuis '+Math.round((Date.now()-S.tm.t0)/60000)+' min':''}</small></div>${dn?`<button onclick="cm('${k}')">✎</button>`:(!c.x&&isT&&o.it.p!=='fixe'?(run?`<button class=p onclick="tmE('${k}')">Je termine</button>`:`<button onclick="tmS('${k}')">Je commence</button>`):'')}</div>`}).join(''):'<p>Rien de prévu ce jour. Utilise ＋ pour ajouter.</p>')+`</div>`}
function bil(m){const r={},T={p:0,r:0,d:0,u:0,rp:0},t=today();for(let i=0;i<7;i++){const d=addD(m,i);occ(d).forEach(o=>{if(C(o.it.cat).x)return;const x=r[o.it.cat]=r[o.it.cat]||{p:0,r:0,m:0},p=o.e-o.s,dn=S.done[o.key];x.p+=p;T.p+=p;if(dn){x.r+=dn;T.r+=dn;T.d++}else if(d<t){x.m++;T.u++}})}
for(const k in S.rep){const d=k.split('@')[1];if(d>=m&&d<=addD(m,6))T.rp++}return{r,T}}
function arch(){const b=mon(today());for(let i=1;i<=8;i++){const m=addD(b,-7*i);if(!S.hist[m]){const x=bil(m);if(x.T.p)S.hist[m]={p:x.T.p,r:x.T.r}}}}
function vB(m){const{r,T}=bil(m),t=today(),rate=T.p?Math.round(100*T.r/T.p):0,rows=S.cats.filter(c=>!c.x&&(r[c.id]||c.t)),se=[];
const tb=rows.map(c=>{const x=r[c.id]||{p:0,r:0,m:0},pc=x.p?Math.round(100*x.r/x.p):0;if(x.p&&c.id!='cours')se.push(pc>=100?`Tu as atteint 100 % de ton objectif « ${c.n} ».`:`${c.n} : ${pc} % de l’objectif.`);
return`<tr><td><i class=dot style="background:${c.c}"></i>${c.n}</td><td>${fh(x.p)}</td><td>${c.t?c.t+'h':'–'}</td><td>${fh(x.r)}</td><td><div class=bar><i style="width:${Math.min(100,pc)}%"></i></div>${pc} %</td><td>${x.m}</td></tr>`}).join('');
let un='';for(let i=0;i<7;i++){const d=addD(m,i);if(d<t)occ(d).forEach(o=>{if(!C(o.it.cat).x&&o.it.p!=='fixe'&&!S.done[o.key])un+=`<div class=gr><span>${d.slice(5)} · ${o.it.t}</span><span><button onclick="ro('${o.key}',1)">Sem. suivante</button> <button onclick="ro('${o.key}',2)">Reprogrammer</button> <button onclick="ro('${o.key}',3)">✕</button></span></div>`})}
return`<h3>Bilan de la semaine</h3><div class=card><b>Prévu ${fh(T.p)} · Réalisé ${fh(T.r)} · ${rate} %</b><br><small>${T.d} terminées · ${T.u} non terminées · ${T.rp} reportées</small><div class=bar style="margin-top:6px"><i style="width:${Math.min(100,rate)}%"></i></div></div>
<div class=card style="overflow-x:auto"><table><tr><th>Activité</th><th>Prévu</th><th>Cible</th><th>Réalisé</th><th>Progression</th><th>Non faites</th></tr>${tb}</table></div>
<div class=card><b>Bilan</b><br>${se.length?se.join('<br>'):'Pas encore de données cette semaine.'}</div>${un?`<div class=card><b>Tâches non réalisées</b>${un}</div>`:''}
<div class=card><b>Historique</b>${Object.keys(S.hist).sort().reverse().slice(0,10).map(k=>`<div onclick="V.wk='${k}';render()" style="cursor:pointer">Semaine du ${k} : ${Math.round(100*S.hist[k].r/S.hist[k].p)} % (${fh(S.hist[k].r)}/${fh(S.hist[k].p)})</div>`).join('')||'<small>Les bilans passés s’enregistrent automatiquement.</small>'}</div>`}
function vS(){const m=V.wk,ds7=[...Array(7)].map((_,i)=>addD(m,i)),t=today();
return nv('Semaine du '+pd(m).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))+`<div class=wk>`+ds7.map(d=>`<div class="day ${d===t?'tod':''}" ondragover="event.preventDefault()" ondrop="dp(event,'${d}')"><b style="cursor:pointer" onclick="V.d='${d}';V.tab='j';render()">${NJ[pd(d).getDay()]} ${+d.slice(8)}</b>${occ(d).filter(o=>!C(o.it.cat).x).map(chip).join('')}</div>`).join('')+`</div>`+vB(m)}
function gl(sc){const a=sc=='m'?(S.mo[V.mo]=S.mo[V.mo]||[]):S.lt;return`<div class=card><b>${sc=='m'?'Objectifs du mois':'Objectifs long terme'}</b>${a.map((g,i)=>`<div class=gr><span>${g.t}</span><span><button onclick="gp('${sc}',${i},-1)">−</button> ${g.n}/${g.g} <button onclick="gp('${sc}',${i},1)">+</button> <button onclick="gp('${sc}',${i},0)">✕</button></span></div><div class=bar><i style="width:${Math.min(100,100*g.n/g.g)}%"></i></div>`).join('')}<p><button onclick="ga('${sc}')">＋ Ajouter</button></p></div>`}
function gp(sc,i,d){const a=sc=='m'?S.mo[V.mo]:S.lt;if(!d)a.splice(i,1);else a[i].n=Math.max(0,a[i].n+d);save()}
function ga(sc){const t=prompt('Objectif :');if(!t)return;const g=+prompt('Valeur cible (nombre) :','1')||1;(sc=='m'?(S.mo[V.mo]=S.mo[V.mo]||[]):S.lt).push({t,n:0,g});save()}
function vM(){const a=V.mo.split('-').map(Number),y=a[0],mm=a[1],lead=(new Date(y,mm-1,1).getDay()+6)%7,n=new Date(y,mm,0).getDate(),t=today(),P={};let g='';for(let i=0;i<lead;i++)g+='<div></div>';
for(let i=1;i<=n;i++){const d=V.mo+'-'+pad(i),os=occ(d).filter(o=>!C(o.it.cat).x);os.forEach(o=>{const x=P[o.it.cat]=P[o.it.cat]||{p:0,r:0};x.p+=o.e-o.s;x.r+=S.done[o.key]||0});const sh=os.filter(o=>o.it.p!=='facultatif');
g+=`<div class="day ${d===t?'tod':''} ${os.some(o=>o.it.cat==='part')?'hot':''}" onclick="V.d='${d}';V.tab='j';render()" ondragover="event.preventDefault()" ondrop="dp(event,'${d}')"><b>${i}</b>${sh.slice(0,3).map(chip).join('')}${sh.length>3?'<small>+'+(sh.length-3)+'</small>':''}</div>`}
return nv(new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))+`<div class=mg>${['L','M','M','J','V','S','D'].map(x=>`<small>${x}</small>`).join('')}${g}</div><h3>Progression du mois</h3><div class=card>`+Object.keys(P).map(id=>{const c=C(id),x=P[id],pc=x.p?Math.round(100*x.r/x.p):0;return`<div class=gr><span><i class=dot style="background:${c.c}"></i>${c.n}</span><span>${fh(x.r)} / ${fh(x.p)}</span></div><div class=bar><i style="width:${pc}%"></i></div>`}).join('')+`</div>`+gl('m')}
function vA(){const y=V.y,t=today();let h='';for(let i=(new Date(y,0,1).getDay()+6)%7;i>0;i--)h+='<i style="visibility:hidden"></i>';
for(const d=new Date(y,0,1);d.getFullYear()==y;d.setDate(d.getDate()+1)){const s=ds(d);let p=0,r=0;occ(s).forEach(o=>{if(C(o.it.cat).x)return;p+=o.e-o.s;r+=S.done[o.key]||0});const k=s>t||!p||!r?0:Math.min(4,Math.ceil(4*r/p));h+=`<i class="h${k}" title="${s} : ${p?Math.round(100*r/p):0} %" onclick="V.d='${s}';V.tab='j';render()"></i>`}
const cat={},tot={};S.items.forEach(i=>cat[i.id]=i.cat);for(const k in S.done){const a=k.split('@');if(a[1].startsWith(y)&&cat[a[0]])tot[cat[a[0]]]=(tot[cat[a[0]]]||0)+S.done[k]}
const mx=Math.max(1,...Object.values(tot)),dl=S.items.filter(i=>i.date&&i.date.startsWith(y)&&i.cat==='part').sort((a,b)=>a.date.localeCompare(b.date)||a.s.localeCompare(b.s));
return nv(y)+`<div class=card><b>Régularité</b><div class=heat>${h}</div></div><div class=card><b>Échéances</b>${dl.map(i=>`<div class=gr><span>${i.date.slice(8)}/${i.date.slice(5,7)} · ${i.t}</span><small>${i.s}–${i.e}</small></div>`).join('')||'<br><small>Aucune échéance (catégorie « Partiels »).</small>'}</div><div class=card><b>Heures réalisées par catégorie</b>`+Object.keys(tot).map(id=>`<div class=gr><span><i class=dot style="background:${C(id).c}"></i>${C(id).n}</span><span>${fh(tot[id])}</span></div><div class=bar><i style="width:${100*tot[id]/mx}%"></i></div>`).join('')+`</div>`+gl('l')}
function prog(){const ts=occ(V.d).filter(o=>!C(o.it.cat).x),n=ts.length;if(!n)return'';const now=nowM(),isT=V.d===today();let i=isT?ts.findIndex(o=>o.e>now):-1;if(isT&&i<0)i=n-1;const L=j=>n>1?100*j/(n-1):0;
return`<footer><div class=track>${isT?`<span class=cur style="left:${L(i)}%">▼</span>`:''}${ts.map((o,j)=>`<span class="pt ${S.done[o.key]?'ok':''}" style="left:${L(j)}%;background:${C(o.it.cat).c}" title="${ft(o.s)} ${o.it.t}"></span>`).join('')}</div></footer>`}
function render(){const c=localStorage.fbcfg;
if(!c&&!localStorage.local){$('#app').innerHTML=`<div class=card style="max-width:560px;margin:30px auto"><h2>Configuration</h2><p>Colle ici la configuration Firebase (voir le guide) ou continue sans synchronisation.</p><textarea id=cf rows=9></textarea><p><button class=p onclick="cs()">Enregistrer</button> <button onclick="localStorage.local=1;render()">Sans synchronisation</button></p></div>`;return}
if(V.login){$('#app').innerHTML=`<div class=card style="max-width:420px;margin:60px auto;text-align:center"><h2>📅 Mon Planning</h2><button class=p onclick="login()">Se connecter avec Google</button><p><small>${V.err||''}</small></p></div>`;return}
const tabs=[['j','Journée'],['s','Semaine'],['m','Mois'],['a','Année']];
$('#app').innerHTML=`<header><b>📅 Planning</b><nav>${tabs.map(t=>`<button class="${V.tab==t[0]?'on':''}" onclick="V.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><span><button onclick="form()">＋</button> <button onclick="set()">⚙</button></span></header><main>${{j:vJ,s:vS,m:vM,a:vA}[V.tab]()}</main>`+(V.tab=='j'?prog():'')}
try{S=JSON.parse(localStorage[KEY])}catch(e){}if(!S||!S.items)S=seed();
V={tab:'j',d:today(),wk:mon(today()),mo:today().slice(0,7),y:new Date().getFullYear()};arch();
if(localStorage.fbcfg){try{fb(JSON.parse(localStorage.fbcfg))}catch(e){}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
setInterval(()=>{if(!$('dialog[open]'))render()},30000);
</script></body></html>
